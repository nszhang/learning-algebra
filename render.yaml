# Render.com Blueprint — deploys the Docker image + a managed PostgreSQL.
# Usage: Render dashboard → New → Blueprint → point at this repo.
services:
  - type: web
    name: algebraace
    runtime: docker            # uses the root Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algebraace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3001"

databases:
  - name: algebraace-db
    plan: free
    databaseName: algebraace
    user: algebraace
