services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algebraace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full-stack app (Express API + built React client) in one container.
  # `docker compose up --build app` → http://localhost:3001
  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/algebraace
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
